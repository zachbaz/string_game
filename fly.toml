# Fly.io app config. If "string-theory-game" is already taken, change `app`
# here to match whatever name `fly launch` / `fly apps create` assigns.
app = "string-theory-game"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
