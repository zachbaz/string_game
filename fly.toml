# fly.toml app configuration file generated for string-theory-game on 2026-08-01T09:21:10-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'string-theory-game'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/data/stringgame.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'stringgame_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
