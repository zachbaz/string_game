<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign up - Game Night</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
  <a href="/" class="back-link">← All games</a>
  <h1>Sign up</h1>
  <p class="error">{error}</p>
  <form class="card" method="post" action="/signup">
    <input type="hidden" name="next" value="{next}">
    <input type="text" name="username" placeholder="Username" maxlength="20" autofocus>
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Sign up</button>
  </form>
  <p>Already have an account? <a href="/login?next={next_urlenc}">Log in</a></p>
</body>
</html>
